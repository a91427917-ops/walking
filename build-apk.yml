name: Build Walky APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project bundle (if present)
        run: |
          if [ -f project-bundle.zip ]; then
            echo "Found project-bundle.zip, extracting..."
            unzip -o project-bundle.zip -d .
          else
            echo "No project-bundle.zip found, assuming files are already in place."
          fi
          echo "---- repo contents after extraction ----"
          find . -maxdepth 3 -not -path "./.git*" | sort

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor deps
        run: npm install

      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Apply custom app icon
        run: |
          RES_DIR=android/app/src/main/res
          if [ -d android-icons ]; then
            cp -rf android-icons/mipmap-mdpi/*        "$RES_DIR/mipmap-mdpi/"
            cp -rf android-icons/mipmap-hdpi/*         "$RES_DIR/mipmap-hdpi/"
            cp -rf android-icons/mipmap-xhdpi/*        "$RES_DIR/mipmap-xhdpi/"
            cp -rf android-icons/mipmap-xxhdpi/*       "$RES_DIR/mipmap-xxhdpi/"
            cp -rf android-icons/mipmap-xxxhdpi/*      "$RES_DIR/mipmap-xxxhdpi/"
            mkdir -p "$RES_DIR/mipmap-anydpi-v26"
            cp -rf android-icons/mipmap-anydpi-v26/*   "$RES_DIR/mipmap-anydpi-v26/"
            echo "icon files applied:"
            find "$RES_DIR" -iname "ic_launcher*"
          else
            echo "android-icons folder not found, skipping icon step (default icon will be used)."
          fi

      - name: Add required permissions to AndroidManifest.xml
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />\n\n    <application#' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: walky-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
